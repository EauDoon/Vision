<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 398" role="img" aria-labelledby="title desc">
<title id="title">Where the sale proceeds go</title><desc id="desc">$2,000 + $750 + $2,250 = $5,000 of synthetic proceeds. Widths are proportional to proceeds.</desc>
<rect width="972" height="398" rx="15" fill="#172f2e"/><g font-family="DejaVu Sans,Arial,sans-serif">
<text x="56" y="57" fill="#8bdfcd" font-size="16" letter-spacing="3">VISION   /   FIELD NOTE 01</text>
<text x="56" y="120" fill="white" font-size="42" font-weight="bold">One sale, two cost lots.</text>
<text x="56" y="164" fill="#d1ded9" font-size="21">$5,000 in fictional proceeds, split by contribution</text>
<rect x="56.000" y="208" width="344.000" height="62" fill="#8bdfcd"/><text x="228.000" y="248" text-anchor="middle" font-size="23" fill="#162d2a">01</text><rect x="400.000" y="208" width="129.000" height="62" fill="#ffcf79"/><text x="464.500" y="248" text-anchor="middle" font-size="23" fill="#162d2a">02</text><rect x="529.000" y="208" width="387.000" height="62" fill="#cbb6ff"/><text x="722.500" y="248" text-anchor="middle" font-size="23" fill="#162d2a">03</text><g transform="translate(63,311)"><circle cy="-5" r="7" fill="#8bdfcd"/><text x="15" font-size="18" fill="#e4eae5">01  Opening lot</text><text x="15" y="35" fill="white" font-size="27">$2,000</text></g><g transform="translate(338,311)"><circle cy="-5" r="7" fill="#ffcf79"/><text x="15" font-size="18" fill="#e4eae5">02  Next lot</text><text x="15" y="35" fill="white" font-size="27">$750</text></g><g transform="translate(643,311)"><circle cy="-5" r="7" fill="#cbb6ff"/><text x="15" font-size="18" fill="#e4eae5">03  Gain</text><text x="15" y="35" fill="white" font-size="27">$2,250</text></g></g></svg>
