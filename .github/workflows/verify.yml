name: Verify Vision

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run the offline Python suite
        run: python3 -m unittest discover -s tests -v
      - name: Check the generated report
        run: python3 report.py --check

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up the browser tests
        run: |
          google-chrome --version
          python3 -m venv "$RUNNER_TEMP/vision-browser"
          "$RUNNER_TEMP/vision-browser/bin/pip" install --disable-pip-version-check --only-binary=:all: playwright==1.65.2
      - name: Check out the pre-design revision for the visual comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c66c33b5afdd4b34b1fd8c739238bd0db981f04b
          path: .ui-comparison-base
          persist-credentials: false
      - name: Capture the same initial dashboard on the base revision
        env:
          VISION_TEST_CHROMIUM: /usr/bin/google-chrome
          VISION_UI_SCREENSHOTS: ${{ runner.temp }}/vision-screens/before
        run: |
          "$RUNNER_TEMP/vision-browser/bin/python" tests/ui_smoke.py --app-root .ui-comparison-base --capture-only
      - name: Run the loopback UI smoke test
        env:
          VISION_TEST_CHROMIUM: /usr/bin/google-chrome
          VISION_UI_SCREENSHOTS: ${{ runner.temp }}/vision-screens/after
        run: |
          "$RUNNER_TEMP/vision-browser/bin/python" tests/ui_smoke.py
      - name: Prepare the synthetic screenshots for this design review
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          import os
          for path in sorted((pathlib.Path(os.environ["RUNNER_TEMP"]) / "vision-screens").glob("*/*-viewport.png")):
              name = path.parent.name + "-" + path.stem
              jpeg = subprocess.check_output(["convert", str(path), "-resize", "900x900>", "-quality", "55", "jpeg:-"])
              payload = base64.b64encode(jpeg).decode("ascii")
              print(f"VISION_FRAME {name} {len(jpeg)}", flush=True)
              for start in range(0, len(payload), 2048):
                  print(f"VISION_CHUNK {name} {start} {payload[start:start+2048]}", flush=True)
          PY
      - name: Save the desktop and mobile renders
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vision-ui-renders
          path: ${{ runner.temp }}/vision-screens
          retention-days: 7
          if-no-files-found: warn
